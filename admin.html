<!DOCTYPE html>
<html>
<head><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin - Sabatia</title></head>
<body>
<h2>Admin - Approve Delivered</h2>
<div id="list">Loading...</div>
<script>
const BASE_ID="appr6dhzTBVcG72LT";
const TABLE_ID="tblYhkWRGvILFlaps";
const TOKEN="patYAKO_HAPA";
async function load(){
  const r=await fetch(`https://api.airtable.com/v0/${BASE_ID}/${TABLE_ID}?sort[0][field]=Order date&sort[0][direction]=desc`,{headers:{"Authorization":`Bearer ${TOKEN}`}});
  const d=await r.json();
  let h="";
  d.records.forEach(rec=>{
    const f=rec.fields;
    const isDelivered = f["Order status"]==="Delivered";
    h+=`<div style="border:1px solid #ccc;padding:10px;margin:10px;${isDelivered?'background:#d4edda':''}">
    <b>${f["Client name"]||''}</b> - ${f["Phone number"]||''} - ${f.Price||780} KES<br>
    <a href="${f["Location link"]||''}" target="_blank">🗺️ Ramani</a><br>
    Status: <b>${f["Order status"]||'Pending'}</b><br>
    ${!isDelivered?`<button onclick="approve('${rec.id}')">✅ APPROVE DELIVERED</button>`: `✅ Imesha-Delivered`}
    </div>`;
  });
  document.getElementById('list').innerHTML=h;
}
async function approve(id){
  await fetch(`https://api.airtable.com/v0/${BASE_ID}/${TABLE_ID}/${id}`,{
    method:"PATCH",
    headers:{"Authorization":`Bearer ${TOKEN}`,"Content-Type":"application/json"},
    body:JSON.stringify({fields:{"Order status":"Delivered"}})
  });
  load();
}
load();
</script>
</body>
</html>
