<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sabatia Fresh</title><style>body{background:#e8f5e9;margin:0;font-family:sans-serif;padding-bottom:100px}.top{background:#fff;margin:10px;padding:12px;border-radius:12px;text-align:center}.blue{background:#1976d2;color:#fff;border:0;width:92%;margin:10px 4%;padding:14px;border-radius:10px;font-weight:bold;font-size:16px}.box{background:#fff;margin:10px;padding:10px;border-radius:10px}.card{background:#fff;margin:8px 10px;padding:14px;border-radius:12px;display:flex;justify-content:space-between;align-items:center;border:1px solid #e0e0e0}.q{display:flex;gap:10px;align-items:center}.q button{width:38px;height:38px;border-radius:50%;border:0;background:#2e7d32;color:#fff;font-size:22px;font-weight:bold}.jumla{background:#fff9c4;margin:10px;padding:14px;border-radius:12px;text-align:center;font-weight:bold;font-size:16px}.order{position:fixed;bottom:0;left:0;right:0;background:#2e7d32;color:#fff;border:0;padding:18px;font-size:18px;font-weight:bold;z-index:50}#admin{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:#e8f5e9;z-index:99;padding:12px;overflow:auto}.row{display:flex;justify-content:space-between;background:#f5f5f5;margin:4px 0;padding:8px;border-radius:8px}.yes{background:#2e7d32;color:#fff;border:0;width:32px;height:32px;border-radius:50%}.no{background:#ffcdd2;border:0;width:32px;height:32px;border-radius:50%}</style></head><body>
<div class="top" id="hdr"><b>🥬 Sabatia Fresh Mboga</b><br><small id="tapinfo">Bonyeeza 5x Admin</small></div>
<button class="blue" id="locBtn">📍 ONYESHA RAMANI</button>
<div class="box"><input id="jina" placeholder="Jina lako" style="width:95%;padding:12px;border-radius:8px;border:1px solid #ccc"><input id="phone" placeholder="Phone 071..." style="width:95%;padding:12px;margin-top:8px;border-radius:8px;border:1px solid #ccc"></div>
<div id="list"></div>
<div class="jumla" id="jumlaTxt">Jumla: 0 KES</div>
<button class="order" id="orderBtn">CHAGUA MBOGA KWANZA</button>
<div id="admin"><div style="background:#fff;padding:12px;border-radius:10px;display:flex;justify-content:space-between"><b>✅ Admin - Orders</b><button onclick="document.getElementById('admin').style.display='none'" style="background:#1976d2;color:#fff;border:0;padding:6px 12px;border-radius:6px">Shop</button></div><div id="adminList">Loading...</div><pre id="dbg" style="background:#000;color:#0f0;padding:8px;font-size:10px;white-space:pre-wrap"></pre></div>
<script>
var BASE="appr6dhzTBVcG72LT"; var TABLE="Sabatia orders"; var TOKEN="patxrbV1qawqoPYNU.04295797a141265d3db9156547d900d5f58aedd7f33276ed76fc0a3c50e3ba02";
var PRODS=[{id:"mayai",n:"Mayai (Tray 30)",p:600},{id:"spinach",n:"Spinach",p:30},{id:"sukuma",n:"Sukuma Wiki",p:30},{id:"kunde",n:"Kunde",p:40},{id:"managu",n:"Managu",p:50},{id:"mitoo",n:"Mitoo",p:40},{id:"mrenda",n:"Mrenda",p:40}];
var cart={}; var lat=-0.1,lng=36,link="https://www.google.com/maps?q=-0.1,36";
function render(){var html="";for(var i=0;i<PRODS.length;i++){var pr=PRODS[i];var q=cart[pr.id]||0;html+='<div class="card"><div><b>'+pr.n+'</b><br>'+pr.p+' KES</div><div class="q"><button onclick="add(\''+pr.id+'\',-1)">-</button><span>'+q+'</span><button onclick="add(\''+pr.id+'\',1)">+</button></div></div>';}document.getElementById("list").innerHTML=html;var sum=0;for(var k in cart){for(var j=0;j<PRODS.length;j++){if(PRODS[j].id==k){sum+=PRODS[j].p*cart[k];}}}var tot=sum>0?sum+20:0;document.getElementById("jumlaTxt").innerHTML="Jumla: "+sum+" + 20 delivery = "+tot+" KES";var btn=document.getElementById("orderBtn");if(sum>0){btn.innerHTML="ORDER SASA - "+tot+" KES";}else{btn.innerHTML="CHAGUA MBOGA KWANZA";}return sum;}
function add(id,d){cart[id]=(cart[id]||0)+d;if(cart[id]<=0)delete cart[id];render();}
render();
document.getElementById("locBtn").onclick=function(){if(navigator.geolocation){navigator.geolocation.getCurrentPosition(function(pos){lat=pos.coords.latitude;lng=pos.coords.longitude;link="https://www.google.com/maps?q="+lat+","+lng;document.getElementById("locBtn").innerHTML="✅ MAHALI PAMEWEKWA";},function(){document.getElementById("locBtn").innerHTML="✅ MAHALI PAMEWEKWA (default)";});}else{document.getElementById("locBtn").innerHTML="✅ MAHALI PAMEWEKWA";}};
document.getElementById("orderBtn").onclick=function(){var sum=render();if(sum==0){alert("Chagua mboga kwanza - bonyeeza +");return;}var jina=document.getElementById("jina").value||"Test";var phone=document.getElementById("phone").value||"0712345678";var details="";for(var k in cart){for(var j=0;j<PRODS.length;j++){if(PRODS[j].id==k){details+=PRODS[j].n+" x"+cart[k]+", ";}}}var total=sum+20;
var payload={fields:{"Client name":jina,"Phone number":phone,"Price":total,"Location name":details,"Location link":link,"Latitude":lat,"Longitude":lng,"Order date":new Date().toISOString().split('T')[0],"Order status":"Pending","Delivered Items":"[]"}};
document.getElementById("admin").style.display="block";document.getElementById("dbg").innerText="Sending...\n"+JSON.stringify(payload,null,2);
fetch("https://api.airtable.com/v0/"+BASE+"/"+encodeURIComponent(TABLE),{method:"POST",headers:{"Authorization":"Bearer "+TOKEN,"Content-Type":"application/json"},body:JSON.stringify(payload)}).then(function(r){return r.json();}).then(function(data){document.getElementById("dbg").innerText+="\n\nRESPONSE:\n"+JSON.stringify(data,null,2);if(data.id){alert("✅ IMEINGIA AIRTABLE!\nID: "+data.id);cart={};render();loadAdmin();var msg="*SABATIA FRESH*%0A"+jina+"%0A"+details+"%0AJumla: "+total+" KES%0A"+link;window.open("https://wa.me/254790326587?text="+msg,"_blank");}else{alert("ERROR: "+JSON.stringify(data));}}).catch(function(e){alert("Network: "+e);});
};
var taps=0;document.getElementById("hdr").onclick=function(){taps++;if(taps>=5){taps=0;var pw=prompt("Password:");if(pw==="1234"){document.getElementById("admin").style.display="block";loadAdmin();}}setTimeout(function(){taps=0;},3000);};
function parseProd(s){if(!s)return[];return s.split(",").map(function(x){return x.trim();}).filter(Boolean).map(function(x){var m=x.match(/(.+) x(\d+)/);if(m)return{name:m[1].trim(),qty:m[2]};return{name:x,qty:1};});}
function loadAdmin(){fetch("https://api.airtable.com/v0/"+BASE+"/"+encodeURIComponent(TABLE)+"?sort[0][field]=Order date&sort[0][direction]=desc",{headers:{"Authorization":"Bearer "+TOKEN}}).then(function(r){return r.json();}).then(function(data){var html="";var recs=data.records||[];for(var i=0;i<recs.length;i++){var f=recs[i].fields||{};var prods=parseProd(f["Location name"]||"");var delivered=[];try{delivered=JSON.parse(f["Delivered Items"]||"[]");}catch(e){delivered=[];}var cnt=0;for(var a=0;a<prods.length;a++){if(delivered.indexOf(prods[a].name)>=0)cnt++;}var badge="PENDING";if(prods.length>0&&cnt==prods.length)badge="FULL";else if(cnt>0)badge="PARTIAL";html+='<div style="background:#fff;margin:8px 0;padding:10px;border-radius:10px"><b>'+(f["Client name"]||'')+'</b> - '+(f["Phone number"]||'')+' - '+(f.Price||0)+' KES <span style="float:right;background:#2e7d32;color:#fff;padding:2px 8px;border-radius:10px;font-size:11px">'+badge+'</span><br><small><a href="'+(f["Location link"]||'#')+'" target="_blank">Ramani</a> | '+(f["Order date"]||'')+'</small><div style="margin-top:6px">';for(var b=0;b<prods.length;b++){var done=delivered.indexOf(prods[b].name)>=0;html+='<div class="row"><span>'+(done?'✅':'❌')+' '+prods[b].name+' x'+prods[b].qty+'</span><button class="'+(done?'yes':'no')+'" onclick="toggle(\''+recs[i].id+'\',\''+prods[b].name.replace(/'/g,"")+'\')">'+(done?'✓':'×')+'</button></div>';}html+='</div></div>';}document.getElementById("adminList").innerHTML=html||"Hakuna orders";}).catch(function(e){document.getElementById("adminList").innerHTML="Error: "+e;});}
function toggle(id,name){fetch("https://api.airtable.com/v0/"+BASE+"/"+encodeURIComponent(TABLE)+"/"+id,{headers:{"Authorization":"Bearer "+TOKEN}}).then(function(r){return r.json();}).then(function(d){var f=d.fields||{};var del=[];try{del=JSON.parse(f["Delivered Items"]||"[]");}catch(e){del=[];}var idx=del.indexOf(name);if(idx>=0)del.splice(idx,1);else del.push(name);var prods=parseProd(f["Location name"]||"");var st="Pending";if(prods.length>0&&del.length==prods.length)st="Delivered";else if(del.length>0)st="Partial";return fetch("https://api.airtable.com/v0/"+BASE+"/"+encodeURIComponent(TABLE)+"/"+id,{method:"PATCH",headers:{"Authorization":"Bearer "+TOKEN,"Content-Type":"application/json"},body:JSON.stringify({fields:{"Delivered Items":JSON.stringify(del),"Order status":st}})});}).then(function(){loadAdmin();});}
</script></body></html>
