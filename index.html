<!DOCTYPE html><html lang="sw"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sabatia Fresh</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>body{font-family:Arial;background:#f0fdf4;margin:0;padding:12px;padding-bottom:90px}h2{text-align:center;color:#166534;margin:6px;cursor:pointer;user-select:none}.top{background:#fff;padding:8px;border-radius:10px;text-align:center;font-size:12px;border:2px solid #16a34a;margin-bottom:8px}.veg{display:flex;gap:8px;padding:10px;background:#fff;align-items:center;border-radius:10px;margin-bottom:6px}.card{margin-bottom:8px}#map{height:250px;border-radius:12px;border:3px solid #16a34a;margin-bottom:8px;display:none}#total{background:#fef08a;padding:12px;border-radius:12px;font-weight:bold;text-align:center;margin:8px 0;border:2px solid #eab308}#order{width:100%;padding:15px;background:#16a34a;color:#fff;border:none;border-radius:12px;font-size:16px;font-weight:bold}#order:disabled{background:#9ca3af}#order2{width:100%;padding:12px;background:#facc15;border:2px dashed #000;border-radius:12px;font-weight:bold;display:none;margin-top:8px}#locInput{width:100%;padding:10px;border-radius:10px;border:2px solid #16a34a;margin-bottom:6px;box-sizing:border-box}input[type=number]{width:55px;padding:8px;border-radius:8px;border:2px solid #16a34a;text-align:center;font-weight:bold}.adminBox{display:none;background:#fff;padding:10px;border-radius:12px;border:3px solid #f59e0b;margin-top:8px}.smallBtn{padding:5px 7px;font-size:11px;background:#111;color:#fff;border:none;border-radius:6px;margin:2px}</style></head><body>
<h2 onclick="openAdminSecure()">🥬 Sabatia Fresh Mboga</h2>
<div class="top">🚴 Delivery 20 KES | 💰 MPESA: <b>0790326587</b><br>📦 Order inaenda kwa wote wawili - Bonyeza kichwa mara 5 Admin</div>
<div class="card" id="vegList"></div>
<button onclick="showMap()" style="width:100%;padding:11px;background:#0ea5e9;color:#fff;border:none;border-radius:10px;font-weight:bold;margin-bottom:6px" id="mapBtn">📍 ONYESHA RAMANI - WEKA PIN MAHALI ULIPO</button>
<div id="map"></div>
<input id="locInput" placeholder="🏠 Maelezo: e.g Nyumba ya blue, kwa chief...">
<div id="total">Jumla: 0 + 20 = 20 KES</div>
<button id="order" onclick="orderNow()" disabled>CHAGUA MBOGA KWANZA</button>
<button id="order2" onclick="sendPartner()">📩 Tuma pia kwa Partner 0111810602</button>
<p id="status" style="text-align:center;font-weight:bold;color:green;font-size:12px"></p>
<div class="adminBox" id="adminBox"><h3 style="text-align:center">Admin - Edit Bei</h3><div id="adminList"></div><hr><input id="vName" placeholder="Jina" style="width:30%;padding:8px"><input id="vPrice" type="number" placeholder="Bei" style="width:20%;padding:8px"><input id="vEmoji" placeholder="Emoji" style="width:20%;padding:8px"><button class="smallBtn" style="background:#16a34a;width:100%;padding:10px;margin-top:6px" onclick="addVeg()">➕ ONGEZA MBOGA</button></div>
<script>
let vegs=[{id:'v1',name:'Sukuma Wiki',price:30,emoji:'🥬'},{id:'v2',name:'Mrenda',price:30,emoji:'🌿'},{id:'v3',name:'Managu',price:40,emoji:'🥗'},{id:'v4',name:'Kunde',price:30,emoji:'☘️'},{id:'v5',name:'Nyanya 1kg',price:80,emoji:'🍅'},{id:'v6',name:'Kitunguu 1kg',price:100,emoji:'🧅'},{id:'v7',name:'Mayai Tray',price:350,emoji:'🥚'}];
const DELIVERY=20,MY="254790326587",PART="254111810602";let lastMsg="",map,marker,pinLat=0.1242,pinLng=34.931;const ADMIN_HASH="OTAzMg==";let adminClicks=0;
function render(){let l=document.getElementById('vegList');l.innerHTML='';let al=document.getElementById('adminList');al.innerHTML='';vegs.forEach(v=>{let d=document.createElement('div');d.className='veg';d.innerHTML='<div style="font-size:26px">'+v.emoji+'</div><div style="flex:1"><b>'+v.name+'</b><br><span style="color:green">'+v.price+' KES</span></div><input type="number" min="0" value="0" id="'+v.id+'" oninput="calc()">';l.appendChild(d);let e=document.createElement('div');e.style.cssText='display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid #eee;font-size:13px';e.innerHTML='<span>'+v.emoji+' '+v.name+' - '+v.price+'</span><span><button class="smallBtn" onclick="editPrice(\''+v.id+'\')">Bei</button><button class="smallBtn" style="background:red" onclick="removeVeg(\''+v.id+'\')">Futa</button></span>';al.appendChild(e);});calc();}
function calc(){let t=0;vegs.forEach(v=>{let q=parseInt(document.getElementById(v.id)?.value)||0;t+=q*v.price;});document.getElementById('total').innerText='Jumla: '+t+' + '+DELIVERY+' = '+(t+DELIVERY)+' KES';let b=document.getElementById('order');if(t==0){b.disabled=true;b.innerText='CHAGUA MBOGA KWANZA';}else{b.disabled=false;b.innerText='📍 TUMA ORDER YA '+(t+DELIVERY)+' KES';}return t;}
function showMap(){let m=document.getElementById('map');m.style.display='block';document.getElementById('mapBtn').innerText='👆 Bonyeza Ramani kuweka PIN';if(!map){map=L.map('map').setView([pinLat,pinLng],14);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);marker=L.marker([pinLat,pinLng],{draggable:true}).addTo(map);marker.on('dragend',e=>{let p=e.target.getLatLng();pinLat=p.lat;pinLng=p.lng;document.getElementById('status').innerText='✅ PIN: '+pinLat.toFixed(5)+', '+pinLng.toFixed(5);});map.on('click',e=>{pinLat=e.latlng.lat;pinLng=e.latlng.lng;marker.setLatLng([pinLat,pinLng]);document.getElementById('status').innerText='✅ PIN: '+pinLat.toFixed(5)+', '+pinLng.toFixed(5);});if(navigator.geolocation){navigator.geolocation.getCurrentPosition(p=>{pinLat=p.coords.latitude;pinLng=p.coords.longitude;map.setView([pinLat,pinLng],16);marker.setLatLng([pinLat,pinLng]);document.getElementById('status').innerText='✅ GPS imepatikana! Sogeza PIN kama sio sahihi';});}}setTimeout(()=>map.invalidateSize(),400);}
function build(t,link,manual){let m='*SABATIA ORDER*%0A%0A';vegs.forEach(v=>{let q=parseInt(document.getElementById(v.id)?.value)||0;if(q>0)m+=v.name+': '+q+' x '+v.price+' = '+(q*v.price)+' KES%0A';});m+='%0A*Jumla:* '+t+'%0ADel: '+DELIVERY+'%0A*JUMLA:* '+(t+DELIVERY)+' KES%0A%0AMPESA: 0790326587 (Deo)%0A';if(link)m+='%0A📍 *PIN LOCATION:*%0A'+link+'%0A';if(manual)m+='%0A🏠 *Maelezo:* '+manual+'%0A';return m;}
function orderNow(){let t=calc();if(t==0){alert('Weka 1 kwanza');return;}let manual=document.getElementById('locInput').value.trim();let link='https://www.google.com/maps?q='+pinLat+','+pinLng;lastMsg=build(t,link,manual);window.open('https://wa.me/'+MY+'?text='+lastMsg,'_blank');document.getElementById('status').innerHTML='✅ Imetumwa! <a href="'+link+'" target="_blank">Fungua PIN</a><br>Bonyeza njano kutuma kwa partner';document.getElementById('order2').style.display='block';}
function sendPartner(){if(!lastMsg){alert('Tuma ya kwanza');return;}window.open('https://wa.me/'+PART+'?text='+lastMsg,'_blank');document.getElementById('status').innerText='✅✅ Wote na PIN!';}
function openAdminSecure(){adminClicks++;if(adminClicks<5){if(adminClicks==4)document.getElementById('status').innerText='Bonyeza mara 1 tena Admin...';return;}let p=prompt('Weka Admin PIN:');if(!p){adminClicks=0;return;}if(btoa(p)===ADMIN_HASH){document.getElementById('adminBox').style.display='block';document.getElementById('status').innerText='✅ Admin mode';}else{alert('PIN si sahihi');}adminClicks=0;}
function addVeg(){let n=document.getElementById('vName').value.trim();let pr=parseInt(document.getElementById('vPrice').value);let e=document.getElementById('vEmoji').value.trim()||'🥬';if(!n||!pr){alert('Jina na bei');return;}vegs.push({id:'v'+Date.now(),name:n,price:pr,emoji:e});render();}
function editPrice(id){let v=vegs.find(x=>x.id==id);let np=prompt('Bei mpya ya '+v.name+'?',v.price);if(np){v.price=parseInt(np);render();}}
function removeVeg(id){if(confirm('Futa?')){vegs=vegs.filter(x=>x.id!=id);render();}}
render();
</script></body></html>
