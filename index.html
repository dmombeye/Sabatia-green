<!DOCTYPE html>
<html>
<head><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sabatia Greens</title></head>
<body>
<h2>Sabatia Greens - 780 KES</h2>
<input id="client" placeholder="Jina"><br><br>
<input id="phone" placeholder="Phone"><br><br>
<button id="orderBtn">ORDER SASA</button>
<script>
const BASE_ID="appr6dhzTBVcG72LT";
const TABLE_ID="tblYhkWRGvILFlaps";
const TOKEN="patYAKO_HAPA"; // Weka token yako hapa

document.getElementById('orderBtn').onclick=()=>{
  const client=document.getElementById('client').value;
  const phone=document.getElementById('phone').value;
  if(!client||!phone){alert("Jaza jina na phone");return;}

  navigator.geolocation.getCurrentPosition(async pos=>{
    const lat=pos.coords.latitude;
    const lng=pos.coords.longitude;
    const mapLink=`https://www.google.com/maps?q=${lat},${lng}`;
    
    // 1. SAVE AIRTABLE
    await fetch(`https://api.airtable.com/v0/${BASE_ID}/${TABLE_ID}`,{
      method:"POST",
      headers:{"Authorization":`Bearer ${TOKEN}`,"Content-Type":"application/json"},
      body:JSON.stringify({fields:{
        "Client name":client,
        "Phone number":phone,
        "Price":780,
        "Location link":mapLink,
        "Latitude":lat,
        "Longitude":lng,
        "Order date":new Date().toISOString().split('T')[0],
        "Order status":"Pending",
        "Order details":`780 KES - ${client}`
      }})
    });

    // 2. WHATSAPP KWA WOTE WAWILI MARA MOJA
    const msg=`*SABATIA ORDER MPYA*%0A%0AClient: ${client}%0APhone: ${phone}%0APrice: 780 KES%0ALocation: ${mapLink}%0A%0ALat: ${lat} Lng: ${lng}`;
    const n1="254790326587";
    const n2="254111810602";
    
    window.open(`https://wa.me/${n1}?text=${msg}`,"_blank");
    setTimeout(()=>{ window.open(`https://wa.me/${n2}?text=${msg}`,"_blank"); }, 800);
    
    alert("Order imetumwa kwa Admin wote wawili!");
  },()=>{alert("Ruhusu Location kwanza");});
}
</script>
</body>
</html>
