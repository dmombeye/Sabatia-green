<!DOCTYPE html>
<html lang="sw"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sabatia Fresh</title>
<style>body{background:#e8f5e9;margin:0;font-family:system-ui;padding:0 0 110px 0}.header{background:#fff;margin:10px;padding:12px;border-radius:12px;text-align:center}.blue-btn{background:#1976d2;color:#fff;border:none;width:90%;margin:10px 5%;padding:13px;border-radius:10px;font-weight:bold}.card{background:#fff;margin:8px 10px;padding:12px;border-radius:12px;display:flex;justify-content:space-between;align-items:center}.qty{display:flex;gap:8px}.qty button{width:34px;height:34px;border-radius:50%;border:none;background:#2e7d32;color:#fff;font-size:20px}.jumla{background:#fff9c4;margin:10px;padding:14px;border-radius:12px;text-align:center;font-weight:bold}.order-btn{position:fixed;bottom:0;left:0;right:0;background:#9e9e9e;color:#fff;border:none;padding:18px;font-size:17px;font-weight:bold}.order-btn.active{background:#2e7d32}</style></head>
<body>
<div class="header" id="headerTap"><b>🥬 Sabatia Fresh Mboga</b><br><small>Delivery 20 KES | MPESA 0790326587 | Bonyeeza mara 5 Admin</small></div>
<button class="blue-btn" id="ramaniBtn">📍 ONYESHA RAMANI</button>
<div style="margin:10px;background:#fff;padding:12px;border-radius:12px"><textarea id="maelezo" placeholder="Maelezo..."></textarea><input id="jina" placeholder="Jina" style="width:100%;padding:10px;margin-top:6px;border-radius:8px;border:1px solid #ccc"><input id="phone" placeholder="Phone" style="width:100%;padding:10px;margin-top:6px;border-radius:8px;border:1px solid #ccc"></div>
<div id="products"></div>
<div style="margin:10px;background:#fff;padding:12px;border-radius:12px;border:1px dashed #2e7d32"><textarea id="customMboga" placeholder="Mboga haipo? Andika..."></textarea></div>
<div class="jumla" id="jumla">Jumla: 0 + 20 = 20 KES</div>
<button class="order-btn" id="orderBtn">CHAGUA MBOGA KWANZA</button>
<div id="adminPanel" style="display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:#e8f5e9;z-index:100;padding:15px;overflow:auto"><div style="background:white;padding:15px;border-radius:12px"><b>✅ Admin Panel</b> <button onclick="document.getElementById('adminPanel').style.display='none'" style="background:#1976d2;color:#fff;border:none;padding:6px 10px;border-radius:6px">Shop</button></div><div id="adminList" style="margin-top:15px">Loading...</div></div>
<script>
const BASE_ID="appr6dhzTBVcG72LT"; const TABLE_ID="tblYhkWRGvILFIaps"; const TOKEN="patZl3EzfBiQzpgay.074ca2e680235aa9158f05ff7a4e7314dd087b141da42ff0afe2d2b342e6d045";
const PRODUCTS=[{id:"mayai",name:"Mayai (Tray 30)",price:600},{id:"spinach",name:"Spinach",price:30},{id:"sukuma",name:"Sukuma Wiki",price:30},{id:"kunde",name:"Kunde",price:40},{id:"managu",name:"Managu",price:50},{id:"mitoo",name:"Mitoo / Marejea",price:40},{id:"mrenda",name:"Mrenda",price:40}];
let cart={},myLat=null,myLng=null,myLink=""; function render(){let h="";PRODUCTS.forEach(p=>{let q=cart[p.id]||0;h+=`<div class="card"><div><b>${p.name}</b> ${p.price} KES</div><div class="qty"><button onclick="chg('${p.id}',-1)">-</button><span>${q}</span><button onclick="chg('${p.id}',1)">+</button></div></div>`});document.getElementById('products').innerHTML=h;updateTotal();}function chg(id,d){cart[id]=(cart[id]||0)+d;if(cart[id]<=0)delete cart[id];render();}function updateTotal(){let sum=0,list=[];for(let id in cart){let pr=PRODUCTS.find(x=>x.id===id);sum+=pr.price*cart[id];list.push(`${pr.name} x${cart[id]}`);}let total=sum>0?sum+20:20;document.getElementById('jumla').innerText=`Jumla: ${sum} + 20 = ${total} KES`;let btn=document.getElementById('orderBtn');if(sum>0){btn.innerText=`ORDER SASA - ${total} KES`;btn.classList.add('active');}else{btn.innerText=`CHAGUA MBOGA KWANZA`;btn.classList.remove('active');}return{sum,total,details:list};}render();
document.getElementById('ramaniBtn').onclick=()=>{navigator.geolocation.getCurrentPosition(p=>{myLat=p.coords.latitude;myLng=p.coords.longitude;myLink=`https://www.google.com/maps?q=${myLat},${myLng}`;document.getElementById('ramaniBtn').innerText="✅ MAHALI PAMEWEKWA";alert("Pin imewekwa");},()=>alert("Ruhusu location"))};
document.getElementById('orderBtn').onclick=async()=>{let {sum,total,details}=updateTotal();if(sum===0){alert("Chagua mboga");return;}let jina=document.getElementById('jina').value,phone=document.getElementById('phone').value,maelezo=document.getElementById('maelezo').value,custom=document.getElementById('customMboga').value;if(!jina||!phone){alert("Weka Jina na Phone");return;}if(!myLink){alert("Bonyeeza Ramani");return;}let fullOrder=details.join(", ");if(custom)fullOrder+=` | Ziada: ${custom}`;try{await fetch(`https://api.airtable.com/v0/${BASE_ID}/${TABLE_ID}`,{method:"POST",headers:{"Authorization":`Bearer ${TOKEN}`,"Content-Type":"application/json"},body:JSON.stringify({fields:{"Client name":jina,"Phone number":phone,"Price":total,"Location link":myLink,"Latitude":myLat,"Longitude":myLng,"Order date":new Date().toISOString().split('T')[0],"Order status":"Pending","Order details":`${fullOrder} | Maelezo: ${maelezo}`}})});}catch(e){}let msg=`*SABATIA FRESH*%0AClient: ${jina}%0APhone: ${phone}%0AOrder: ${fullOrder}%0AJumla: ${total} KES%0ALoc: ${myLink}`;window.open(`https://wa.me/254790326587?text=${msg}`,"_blank");setTimeout(()=>{window.open(`https://wa.me/254111810602?text=${msg}`,"_blank");},800);alert("Order imetumwa kwa wote wawili!");};
let taps=0;document.getElementById('headerTap').onclick=()=>{taps++;if(taps>=5){taps=0;let p=prompt("Password:");if(p==="1234"){document.getElementById('adminPanel').style.display='block';loadAdmin();}}};
async function loadAdmin(){try{let res=await fetch(`https://api.airtable.com/v0/${BASE_ID}/${TABLE_ID}`,{headers:{"Authorization":`Bearer ${TOKEN}`}});let data=await res.json();if(!data.records){document.getElementById('adminList').innerHTML=`Error: ${JSON.stringify(data)}`;return;}let html="";data.records.forEach(rec=>{let f=rec.fields||{};let done=f["Order status"]==="Delivered";html+=`<div style="background:${done?'#d4edda':'white'};margin:8px;padding:12px;border-radius:10px;border:${done?'2px solid #2e7d32':'1px solid #eee'}"><b>${f["Client name"]||''}</b> - ${f["Phone number"]||''}<br>${f["Order details"]||''}<br>${f.Price||''} KES - <a href="${f["Location link"]||'#'}" target="_blank">Ramani</a><br>Status: <b>${f["Order status"]||'Pending'}</b><br>${!done?`<button onclick="approve('${rec.id}')" style="background:#2e7d32;color:#fff;border:none;padding:8px 12px;border-radius:6px;margin-top:6px">✅ Approve Delivered</button>`:'✅ Iko Delivered - PROOF'}</div>`;});document.getElementById('adminList').innerHTML=html||"Hakuna orders";}catch(e){document.getElementById('adminList').innerHTML="Error: "+e;}}
async function approve(id){await fetch(`https://api.airtable.com/v0/${BASE_ID}/${TABLE_ID}/${id}`,{method:"PATCH",headers:{"Authorization":`Bearer ${TOKEN}`,"Content-Type":"application/json"},body:JSON.stringify({fields:{"Order status":"Delivered"}})});loadAdmin();}
</script></body></html>
