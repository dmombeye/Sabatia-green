<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sabatia v13 FINAL</title><style>body{background:#e8f5e9;margin:0;font-family:sans-serif;padding-bottom:130px}.top{background:#fff;margin:10px;padding:14px;border-radius:12px;text-align:center;border:2px solid #2e7d32}.blue{background:#1976d2;color:#fff;border:0;width:92%;margin:10px 4%;padding:14px;border-radius:10px;font-weight:bold}.card{background:#fff;margin:8px 10px;padding:14px;border-radius:12px;display:flex;justify-content:space-between;align-items:center;border:1px solid #a5d6a7}.q{display:flex;gap:10px;align-items:center}.q button{width:40px;height:40px;border-radius:50%;border:0;background:#2e7d32;color:#fff;font-size:22px}.jumla{background:#fff9c4;margin:10px;padding:14px;border-radius:12px;text-align:center;font-weight:bold}.order{position:fixed;bottom:0;left:0;right:0;background:#2e7d32;color:#fff;border:0;padding:20px;font-size:18px;font-weight:bold;z-index:999}#admin{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:#e8f5e9;z-index:1000;padding:12px;overflow:auto}textarea{width:95%;padding:12px;border-radius:8px;border:2px solid #ff9800;background:#fffde7}</style></head><body>
<div class="top" id="hdr"><b>🥬 Sabatia Fresh Mboga v13 FINAL</b><br><small>Bonyeeza 5x Admin</small></div>
<button class="blue" id="locBtn">📍 ONYESHA RAMANI</button>
<div style="margin:10px;background:#fff;padding:12px;border-radius:10px"><input id="jina" placeholder="Jina lako kamili" style="width:95%;padding:12px;border-radius:8px;border:1px solid #999"><input id="phone" placeholder="Phone 071..." style="width:95%;padding:12px;margin-top:8px;border-radius:8px;border:1px solid #999"><textarea id="maelezo" rows="3" placeholder="Maelezo ya mteja (itaenda WhatsApp pekee): Mf. Nataka mayai kubwa, spinach safi..."></textarea><small style="color:#e65100">⚠️ Maelezo inaenda WhatsApp pekee!</small></div>

<div class="card"><div><b>Mayai (Tray 30)</b><br>600 KES</div><div class="q"><button onclick="chg('mayai',-1)">-</button><span id="q-mayai">0</span><button onclick="chg('mayai',1)">+</button></div></div>
<div class="card"><div><b>Spinach</b><br>30 KES</div><div class="q"><button onclick="chg('spinach',-1)">-</button><span id="q-spinach">0</span><button onclick="chg('spinach',1)">+</button></div></div>
<div class="card"><div><b>Sukuma Wiki</b><br>30 KES</div><div class="q"><button onclick="chg('sukuma',-1)">-</button><span id="q-sukuma">0</span><button onclick="chg('sukuma',1)">+</button></div></div>
<div class="card"><div><b>Kunde</b><br>40 KES</div><div class="q"><button onclick="chg('kunde',-1)">-</button><span id="q-kunde">0</span><button onclick="chg('kunde',1)">+</button></div></div>
<div class="card"><div><b>Managu</b><br>50 KES</div><div class="q"><button onclick="chg('managu',-1)">-</button><span id="q-managu">0</span><button onclick="chg('managu',1)">+</button></div></div>
<div class="card"><div><b>Mitoo</b><br>40 KES</div><div class="q"><button onclick="chg('mitoo',-1)">-</button><span id="q-mitoo">0</span><button onclick="chg('mitoo',1)">+</button></div></div>
<div class="card"><div><b>Mrenda</b><br>40 KES</div><div class="q"><button onclick="chg('mrenda',-1)">-</button><span id="q-mrenda">0</span><button onclick="chg('mrenda',1)">+</button></div></div>

<div class="jumla" id="jumla">Jumla: 0 + 20 = 0 KES</div>
<button class="order" id="orderBtn">CHAGUA MBOGA (+)</button>
<div id="admin"><div style="background:#fff;padding:12px;border-radius:10px;display:flex;justify-content:space-between"><b>✅ Admin Orders</b><button onclick="document.getElementById('admin').style.display='none'" style="background:#1976d2;color:#fff;border:0;padding:8px 14px;border-radius:6px">Shop</button></div><div id="adminList">Loading...</div><pre id="dbg" style="background:#000;color:#0f0;padding:10px;font-size:11px;white-space:pre-wrap"></pre></div>
<script>
var BASE="appr6dhzTBVcG72LT"; var TABLE="Sabatia orders"; var TOKEN="patxrbV1qawqoPYNU.04295797a141265d3db9156547d900d5f58aedd7f33276ed76fc0a3c50e3ba02";
var prices={mayai:600,spinach:30,sukuma:30,kunde:40,managu:50,mitoo:40,mrenda:40}; var names={mayai:"Mayai (Tray 30)",spinach:"Spinach",sukuma:"Sukuma Wiki",kunde:"Kunde",managu:"Managu",mitoo:"Mitoo",mrenda:"Mrenda"};
var cart={},lat=-0.091,lng=34.774,link="https://www.google.com/maps?q=-0.091,34.774";
function chg(id,d){cart[id]=(cart[id]||0)+d; if(cart[id]<=0)delete cart[id]; document.getElementById("q-"+id).innerText=cart[id]||0; update();}
function update(){var sum=0,det=""; for(var k in cart){sum+=prices[k]*cart[k]; det+=names[k]+" x"+cart[k]+", ";} var tot=sum>0?sum+20:0; document.getElementById("jumla").innerText="Jumla: "+sum+" + 20 delivery = "+tot+" KES"; var b=document.getElementById("orderBtn"); if(sum>0){b.innerText="ORDER SASA - "+tot+" KES";} else {b.innerText="CHAGUA MBOGA (+)";} return {sum:sum,total:tot,det:det};}
document.getElementById("locBtn").onclick=function(){navigator.geolocation.getCurrentPosition(function(p){lat=p.coords.latitude;lng=p.coords.longitude;link="https://www.google.com/maps?q="+lat+","+lng; document.getElementById("locBtn").innerText="✅ MAHALI PAMEWEKWA";});};
document.getElementById("orderBtn").onclick=function(){var o=update(); if(o.sum==0){alert("Chagua mboga"); return;} var jina=document.getElementById("jina").value||"Dennis"; var phone=document.getElementById("phone").value||"0790326587"; var maelezo=document.getElementById("maelezo").value||"Hakuna maelezo";
// FIX KUBWA: Tumeondoa Order details kabisa! Tunatuma fields zipo tu kama video yako!
var payload={fields:{"Client name":jina,"Phone number":phone,"Price":o.total,"Location name":o.det,"Location link":link,"Latitude":lat,"Longitude":lng,"Order date":new Date().toISOString().split('T')[0],"Order status":"Pending","Delivered items":"[]"}};
document.getElementById("admin").style.display="block"; document.getElementById("dbg").innerText="Sending FINAL (bila Order details)...\n"+JSON.stringify(payload,null,2);
fetch("https://api.airtable.com/v0/"+BASE+"/"+encodeURIComponent(TABLE),{method:"POST",headers:{"Authorization":"Bearer "+TOKEN,"Content-Type":"application/json"},body:JSON.stringify(payload)}).then(function(r){return r.json();}).then(function(data){document.getElementById("dbg").innerText+="\n\nRESPONSE:\n"+JSON.stringify(data,null,2); if(data.id){alert("✅ IMEINGIA AIRTABLE!"); cart={}; for(var k in prices){document.getElementById("q-"+k).innerText=0;} document.getElementById("maelezo").value=""; update(); loadAdmin();
// WhatsApp na maelezo na partner kama zamani!
var msg="*🥬 SABATIA FRESH MBOGA*%0A%0A*Client:* "+jina+"%0A*Phone:* "+phone+"%0A*Order:* "+o.det+"%0A*Maelezo ya Mteja:* "+maelezo+"%0A*Jumla:* "+o.total+" KES%0A*Location:* "+link;
window.open("https://wa.me/254790326587?text="+msg,"_blank");
} else {alert("ERROR BADO: "+JSON.stringify(data));}}).catch(function(e){alert(e);});
};
var taps=0; document.getElementById("hdr").onclick=function(){taps++; if(taps>=5){taps=0; var pw=prompt("Password:"); if(pw==="1234"){document.getElementById("admin").style.display="block"; loadAdmin();}} setTimeout(function(){taps=0;},3000);};
function loadAdmin(){fetch("https://api.airtable.com/v0/"+BASE+"/"+encodeURIComponent(TABLE)+"?sort[0][field]=Order date&sort[0][direction]=desc",{headers:{"Authorization":"Bearer "+TOKEN}}).then(function(r){return r.json();}).then(function(data){var html=""; var recs=data.records||[]; for(var i=0;i<recs.length;i++){var f=recs[i].fields||{}; html+='<div style="background:#fff;margin:8px 0;padding:12px;border-radius:10px"><b>'+(f["Client name"]||'')+'</b> - '+(f["Phone number"]||'')+'<br>'+(f["Location name"]||'')+'<br><b>'+(f.Price||0)+' KES</b> - <a href="'+(f["Location link"]||'#')+'" target="_blank">Ramani</a></div>';} document.getElementById("adminList").innerHTML=html||"Hakuna orders";}).catch(function(e){document.getElementById("adminList").innerHTML="Error: "+e;});}
update();
</script></body></html>
